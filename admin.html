<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenShelf Admin Preview</title><link rel="stylesheet" href="styles.css"><script defer src="apps.js"></script><script defer src="admin.js"></script></head><body>
<header class="header"><div class="wrap nav"><a class="brand" href="index.html"><span class="brand-icon">O</span><span>Open<span>Shelf</span></span></a><a class="btn ghost" href="index.html">View site</a></div></header>
<main class="detail-page"><div class="wrap"><div class="admin-head"><div><div class="kicker">Content manager</div><h1 class="page-title">App manager</h1><p class="lead">Frontend preview for the future database-backed admin panel.</p></div><button class="btn primary" id="exportBtn">Export JSON</button></div>
<div class="admin-grid"><form class="form-card" id="appForm"><h3>Add / edit listing</h3><label>Name<input id="fName" required></label><label>ID<input id="fId" required placeholder="my-app"></label><label>Category<input id="fCat" required></label><label>Tagline<input id="fTag"></label><label>Description<textarea id="fDesc"></textarea></label><label>Latest version<input id="fVersion" placeholder="1.0.0"></label><label>Official/source URL<input id="fLink" type="url"></label><label>Download URL<input id="fDownload" type="url"></label><button class="btn primary big">Add to browser catalog</button><p class="small">This demo stores changes in your browser only. A real shared admin requires a backend/database.</p></form>
<div><div class="panel"><div class="panel-head"><b>Current catalog</b><span id="adminCount"></span></div><div id="adminList"></div></div></div></div></div></main></body></html>
