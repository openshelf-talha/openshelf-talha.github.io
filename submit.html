<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Submit an App — OpenShelf</title><link rel="stylesheet" href="styles.css?v=3.2"></head><body>
<header class="header"><div class="wrap nav"><a class="brand" href="index.html"><span class="brand-icon">O</span><span>Open<span>Shelf</span></span></a><a class="btn ghost" href="index.html">← Home</a></div></header>
<main class="detail-page"><div class="wrap narrow"><div class="kicker">Publisher submissions</div><h1 class="page-title">Add an app to OpenShelf.</h1><p class="lead">This static version prepares an email. Later, the same form can connect to your admin/database system.</p>
<form class="form-card" onsubmit="event.preventDefault(); const body='App: '+name.value+'\\nCategory: '+category.value+'\\nOfficial URL: '+url.value+'\\nDescription: '+description.value; location.href='mailto:openshelf@example.com?subject=OpenShelf%20Submission&body='+encodeURIComponent(body);">
<label>App name<input id="name" required></label><label>Category<select id="category"><option>Productivity</option><option>Media</option><option>Utility</option><option>Developer</option><option>Office</option><option>Communication</option><option>Games</option></select></label><label>Official/source URL<input id="url" type="url" required></label><label>Description<textarea id="description" required></textarea></label><button class="btn primary big" type="submit">Prepare submission →</button>
</form></div></main></body></html>
